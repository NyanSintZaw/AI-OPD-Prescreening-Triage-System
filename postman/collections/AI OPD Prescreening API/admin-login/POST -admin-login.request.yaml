$kind: http-request
name: POST /admin/login
description: |-
  Admin Login

  **Auth:** none (patient-facing).
url: "{{baseUrl}}/admin/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('2xx', () => pm.response.to.be.success);
      const v = pm.response.json().access_token;
      if (pm.environment.name) {
        pm.environment.set('token', v);
      } else {
        pm.collectionVariables.set('token', v);
      }
    language: text/javascript
order: 1000
