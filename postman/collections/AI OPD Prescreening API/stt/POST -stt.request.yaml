$kind: http-request
name: POST /stt
description: |-
  Transcribe a short audio clip. Returns the recognized text.

  **Auth:** none (patient-facing).
url: "{{baseUrl}}/stt"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
auth:
  type: noauth
order: 1000
