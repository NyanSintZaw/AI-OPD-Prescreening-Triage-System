$kind: http-request
name: PATCH /doctors/{doctor_id}
description: |-
  Update a doctor profile. Requires admin or nurse role.

  **Roles:** super_admin, nurse
url: "{{baseUrl}}/doctors/{{doctor_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "string",
      "title": "string",
      "specialization": "string",
      "department_id": "00000000-0000-0000-0000-000000000000",
      "phone_ext": "string",
      "notes": "string",
      "is_active": false
    }
order: 4000
