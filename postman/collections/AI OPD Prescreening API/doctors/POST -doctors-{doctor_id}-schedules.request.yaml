$kind: http-request
name: POST /doctors/{doctor_id}/schedules
description: |-
  Add a date-specific schedule entry for a doctor.

  **Roles:** super_admin, nurse
url: "{{baseUrl}}/doctors/{{doctor_id}}/schedules"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "schedule_date": "string",
      "start_time": "string",
      "end_time": "string",
      "break_start": "string",
      "break_end": "string",
      "room": "string",
      "slot_label": "string",
      "is_available": true,
      "notes": "string"
    }
order: 6000
