$kind: http-request
name: GET /schedules/available
description: |-
  Return doctors with their available schedule entries for a given date
  (defaults to today). Old entries are never deleted — only today's are surfaced.
  Used by the AI to answer patient availability queries.

  **Auth:** none (patient-facing).
url: "{{baseUrl}}/schedules/available?schedule_date=&department_id="
method: GET
queryParams:
  schedule_date: ""
  department_id: ""
auth:
  type: noauth
order: 1000
