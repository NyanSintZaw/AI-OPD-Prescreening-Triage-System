$kind: http-request
name: POST /tts
description: |-
  Synthesize speech for the given text. Returns audio/mpeg (MP3) bytes.

  **Auth:** none (patient-facing).
url: "{{baseUrl}}/tts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "text": "string",
      "language": "en"
    }
auth:
  type: noauth
order: 1000
