$kind: collection
id: 3ab0d8a5-bd7a-5705-8ea9-fe9df01b8bbf
name: AI OPD Prescreening API
description: |-
  AI OPD Prescreening & Triage System — generated from the FastAPI app's own OpenAPI definition (`scripts/api_docs/generate.py`), so it never drifts from the code.

  **Getting started:** select the `local` environment, then run `POST /admin/login` — the token is captured automatically and every role-protected request inherits it.

  Seeded logins: `opd.nurse@mfu.local` / `nurse1234` (role `nurse`), `ops.admin@mfu.local` / `admin1234` (role `super_admin`).

  Not included: `WS /ws/voice/{session_id}` — create it as a Postman WebSocket request (see `docs/api-reference.md` for the frame contract).
auth:
  - id: 7cc85454-d3c3-4132-ac05-7ec9e00df8ee
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
