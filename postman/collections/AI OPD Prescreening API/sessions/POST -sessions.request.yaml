$kind: http-request
name: POST /sessions
description: |-
  Create Session

  **Auth:** none (patient-facing).
url: "{{baseUrl}}/sessions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "language": "th",
      "user_agent": "string",
      "ip_hash": "string",
      "metadata": {}
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('2xx', () => pm.response.to.be.success);
      const v = pm.response.json().id;
      if (pm.environment.name) {
        pm.environment.set('session_id', v);
      } else {
        pm.collectionVariables.set('session_id', v);
      }
    language: text/javascript
order: 1000
