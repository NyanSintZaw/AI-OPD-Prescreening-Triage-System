$kind: http-request
name: PATCH /sessions/{session_id}
description: |-
  Update Session

  **Auth:** none (patient-facing).
url: "{{baseUrl}}/sessions/{{session_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active"
    }
auth:
  type: noauth
order: 8000
