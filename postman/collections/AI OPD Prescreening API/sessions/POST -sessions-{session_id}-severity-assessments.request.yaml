$kind: http-request
name: POST /sessions/{session_id}/severity-assessments
description: |-
  Create Severity Assessment

  **Auth:** none (patient-facing).
url: "{{baseUrl}}/sessions/{{session_id}}/severity-assessments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "source_message_id": "00000000-0000-0000-0000-000000000000",
      "severity": "unknown",
      "confidence": 0.0,
      "explanation": "string",
      "detected_triggers": []
    }
auth:
  type: noauth
order: 15000
