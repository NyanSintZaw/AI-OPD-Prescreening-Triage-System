    {
      "trigger_id": "00000000-0000-0000-0000-000000000000",
      "source_message_id": "00000000-0000-0000-0000-000000000000",
      "detected_symptoms": [],
      "alert_message": "string"
    }
auth:
  type: noauth
order: 20000
