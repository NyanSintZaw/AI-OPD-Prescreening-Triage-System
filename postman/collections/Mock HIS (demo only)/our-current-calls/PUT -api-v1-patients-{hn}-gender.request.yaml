$kind: http-request
name: PUT /api/v1/patients/{hn}/gender
description: |-
  ⚠️ **OUR ASSUMPTION — iMed documents no counterpart.**

  **WE PUT** — patient gender collected at the booth when the HN record lacks it (`HttpHisAdapter.push_patient_gender`). Fill-only: never overwrites a recorded value.

  Write back the gender the booth collected when the hospital record
  lacks it. Same rule as the history write-back: only ever fills an
  empty value, never overwrites what the hospital already holds.
url: "{{hisBaseUrl}}/api/v1/patients/{{hn}}/gender"
method: PUT
headers:
  X-API-Key: "{{hisToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "gender": "male"
    }
order: 5000
