$kind: http-example
request:
  url: "{{imedBaseUrl}}/patient-assignments"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "request_id": "MFU-20260807-A1B2C3",
        "visit_id": "{{imedVisitId}}",
        "assign_spid": "SP_OPD_MED_01",
        "sbar": {
          "situation": "แน่นหน้าอกมา 2 ชั่วโมง ร้าวไปแขนซ้าย",
          "background": "ความดันโลหิตสูง กินยาสม่ำเสมอ ไม่มีประวัติแพ้ยา อายุ 58 ปี",
          "assessment": "BP 158/94, ชีพจร 96, อุณหภูมิ 36.8, SpO2 97% (วัดที่บูธ) — ระดับการคัดกรอง 3",
          "assessment_problem": "เจ็บหน้าอกร่วมกับปัจจัยเสี่ยงโรคหัวใจ (คู่มือคัดกรอง MFU ข้อ 4.2)",
          "recommend": "ส่งตรวจอายุรกรรม ประเมินโดยแพทย์"
        }
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      // We treat this as SUCCESS (our earlier attempt landed). But with no `result` we never learn queue_number, so the nurse has nothing to hand over -> change request 7.
      {
        "request_id": "MFU-20260807-A1B2C3",
        "status": "STATUS_BUSINESS_ERROR",
        "message": "VISIT_QUEUE_ALREADY_EXIST",
        "message_th": "ผู้ป่วยอยู่ในคิวของจุดบริการปลายทางแล้ว"
      }
order: 2000
