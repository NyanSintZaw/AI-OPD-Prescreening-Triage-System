$kind: http-example
request:
  url: "{{imedBaseUrl}}/patient-assignments"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "request_id": "MFU-20260807-A1B2C3",
        "visit_id": "{{imedVisitId}}",
        "assign_spid": "SP_OPD_MED_01",
        "sbar": {
          "situation": "แน่นหน้าอกมา 2 ชั่วโมง ร้าวไปแขนซ้าย (อายุ 58 ปี)",
          "background": "โรคประจำตัว: ความดันโลหิตสูง | แพ้ยา/แพ้สาร: ไม่มี",
          "assessment": "ความดัน 158/94 ชีพจร 96 อุณหภูมิ 36.8 น้ำหนัก 72.5 กก. ส่วนสูง 165 ซม. (วัดที่บูธ) | ระดับคัดกรอง 3 (Urgent) | ระดับความเจ็บปวด 6/10",
          "assessment_problem": "เจ็บหน้าอกร่วมกับปัจจัยเสี่ยงโรคหัวใจ (คู่มือคัดกรอง MFU ข้อ 4.2)",
          "recommend": "ส่งต่อ แผนก OPD MED (อายุรกรรม) | ควรได้รับการตรวจภายใน 30 นาที",
          "documentation": "รหัสสลิป MCH-A1B2-C3D4"
        }
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      // Permanent — we do NOT retry. Nurse sees: visit is closed, send the patient to the front desk.
      {
        "request_id": "MFU-20260807-A1B2C3",
        "status": "STATUS_BUSINESS_ERROR",
        "message": "VISIT_LOCKED_OR_FINANCIAL_DISCHARGED",
        "message_th": "visit ถูกล็อกหรือจำหน่ายทางการเงินแล้ว"
      }
order: 3000
