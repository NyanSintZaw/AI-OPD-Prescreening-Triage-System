$kind: http-request
name: POST /patient-assignments (+ mfu_prescreen)
description: |
  **Nothing here is in your contract yet — this is the ask.**

  ## 1. Let us send the department, and you resolve the service point (CR 15)

  Notice `assign_spid` is **gone** from this body, replaced by
  `base_department_id`.

  Our system routes to a **department** — "internal medicine", "ENT". It has no
  concept of a room, a floor or a session, because triage criteria do not have
  one. Today your contract requires `assign_spid`, so we have to invent the
  missing half: a hard-coded table mapping each of our departments to one
  service point id.

  That mapping is the weakest thing in this integration, and it is weak in three
  ways:

  * **It can be wrong and we would not know.** If OPD MED runs two rooms, we
    send every patient to whichever one we hard-coded.
  * **It goes stale silently.** You reorganise a service point, our table still
    says the old id, and patients queue in the wrong place until someone
    notices.
  * **It fails where you would succeed.** If the room we picked is closed we
    get `SERVICE_POINT_NOT_AVAILABLE` and the nurse has to reroute — even when
    another room in the same department is open. You have
    `checkServicePointOpen` and the master data; you can pick the open one.

  You already derive the department from the service point when we omit it. We
  are asking for the reverse: accept the department and derive the service
  point.

  *(The read-back request in this folder shows `assign_spid` in its response.
  That is deliberate and consistent: you resolve it, then tell us which one you
  picked — which is also how we would learn the room to print or read out.)* If a department genuinely has one service point, this costs you a
  lookup we would otherwise hard-code. If it has several, only you can choose
  correctly.

  **This also removes the blocking master-data dependency.** We would still need
  your department ids, but not the service-point ids — a much shorter list, and
  one that changes far less often.

  If you would rather keep `assign_spid` required, that is fine — we send it,
  and we simply need the per-department mapping and a rule for departments with
  more than one service point.

  ## 2. Extra fields, in one additive object

  Otherwise identical to request 1, plus a single additive `mfu_prescreen`
  object.

  One namespaced wrapper rather than loose top-level fields, for two reasons:
  nothing here can collide with a field you add later, and there is no chance of
  reading it as something we already send. **We are not asking you to adopt this
  shape** — only to tell us where these values should live. If you would rather
  have them flat, or under different names, say so; the values are the ask, not
  the spelling.

  | In `mfu_prescreen` | Change request | Why it matters |
  |---|---|---|
  | `triage_level`, `triage_scale`, `triage_label` | **CR 1 — highest value** | The 5-level triage is our system's whole output. With no field it is buried in SBAR prose, so your destination queue sorts by arrival time instead of by how sick the patient is. `triage_level` is the integer 1–5 our engine already produces; `triage_scale` is `MOPH-5`, the Thai MOPH ED Triage 5-level guideline (กรมการแพทย์ 2561) our criteria are built on — see `docs/criteria-standards.md`. Name them whatever suits your schema; the value is what matters. |
  | `vitals` (structured, with `measured_at` and a per-field `sources` map) | CR 2 | **Provenance is per field, not per reading.** The BP and pulse come off an Omron cuff; the weight, height and often the temperature are what the patient told us. Treating them as one kind of evidence would let a self-reported weight be charted as a booth measurement. We send each reading **once**, as a number, rather than also restating it in `sbar.assessment` — the same value in two shapes drifts the moment one is edited, and a sentence cannot carry provenance you can query. These are the only vital fields our booth produces, and they are **not** a one-to-one match for your Prescreen columns: we split `pressure` into `systolic`/`diastolic`, we send `bmi` derived at send time from the weight and height in the same payload (never stored, so it cannot survive a re-measure and contradict them), and we add a `sources` map you have no column for. That difference is expected — map them however suits your side. |
  | `confirmed_by` | CR 3 | Sender identity comes from the token, so iMed records "the MFU triage system", not the nurse who signed off. Matters for audit after an incident. |
  | `source_ref` | CR 4 | Lets your staff open the full transcript and the AI's cited reasoning, not just the summary. **`slip_code` and `session_ref` are the same identity, not two keys** — the slip code is the first and last four characters of the session id (`…1ba646bb…811eb` → `MCH-1BA6-11EB`). Store `session_ref` if you store one: the derivation is one-way, so a slip code cannot be resolved back. The slip code exists because it is short enough to print on the patient's paper slip and read out. Neither contains patient data. |
  | `rerouted` | — | We know when a nurse overrode the AI's department. There is no iMed field, so today it can only go into `sbar.recommend` as prose. |

  If any of these are accepted we implement them our side and this request
  becomes request 1.

  *Against our mock this reuses request 1's `request_id`, so it replays request
  1's result rather than queueing the patient twice — that is the idempotency
  rule working, not the proposed fields being ignored.*
url: "{{imedBaseUrl}}/patient-assignments"
method: POST
headers:
  Content-Type: application/json
