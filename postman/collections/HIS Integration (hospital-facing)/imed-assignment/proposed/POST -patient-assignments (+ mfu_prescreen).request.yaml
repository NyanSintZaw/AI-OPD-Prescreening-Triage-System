        "triage_label": "Urgent",
        "vitals": {
          "systolic": 158,
          "diastolic": 94,
          "pulse_bpm": 96,
          "temperature_c": 36.8,
          "weight_kg": 72.5,
          "height_cm": 165,
          "measured_at": "2026-08-07T09:12:00+07:00",
          "source": "cuff"
        },
        "confirmed_by": "OPD Nurse (สมหญิง)",
        "source_ref": {
          "slip_code": "MCH-A1B2-C3D4",
