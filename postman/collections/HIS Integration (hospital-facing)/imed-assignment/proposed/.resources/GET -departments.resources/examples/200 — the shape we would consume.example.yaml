$kind: http-example
request:
  url: "{{imedBaseUrl}}/departments"
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      // A sync, not a per-patient call. The one-time list is what unblocks us; this keeps it from going stale.
      {
        "departments": [
          {
            "id": "DEPT_MED",
            "name": "แผนก OPD MED (อายุรกรรม)",
            "active": true
          },
          {
            "id": "DEPT_ENT",
            "name": "แผนก OPD E.N.T (หู คอ จมูก)",
            "active": true
          },
          {
            "id": "DEPT_ER",
            "name": "แผนก ER (อุบัติเหตุและฉุกเฉิน)",
            "active": true
          }
        ]
      }
order: 1000
