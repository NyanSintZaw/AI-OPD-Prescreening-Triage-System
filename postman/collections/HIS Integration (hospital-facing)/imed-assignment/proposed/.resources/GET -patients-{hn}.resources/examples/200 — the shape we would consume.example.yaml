          "chronic_conditions": "ความดันโลหิตสูง",
          "past_surgeries": null,
          "family_history": null,
          "smoking": null,
          "alcohol": null,
          "recorded_at": "2026-02-11T09:20:00+07:00"
        },
        "last_vitals": {
          "weight": 72.5,
