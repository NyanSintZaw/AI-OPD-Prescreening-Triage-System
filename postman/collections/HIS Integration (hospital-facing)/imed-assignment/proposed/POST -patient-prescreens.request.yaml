$kind: http-request
name: POST /patient-prescreens
description: |
  ⚠️ **Not in your contract — change request 14.**

  Your contract has one write: the assignment, which fires when a nurse
  confirms. That leaves a gap: **if a patient uses the booth and walks out
  before reaching a nurse, iMed never learns they were there** — including the
  blood pressure we measured with a real cuff.

  This marks the patient as **pre-screened and awaiting nurse confirmation**,
  and records what we measured. It is the first of the two states; the
  assignment is the second.

  ### Deliberately NOT included

  **No triage level. No recommended department. No AI reasoning.** Nothing a
  clinician could act on arrives here.

  That is the whole point. Our safety rule is that no machine judgement reaches
  your record until a nurse signs it off — if this call carried the
  recommendation, someone downstream could act on unreviewed AI output and the
  nurse-confirm step would be decorative. So this carries only what an
  instrument measured and the fact that the patient was at the booth. The
  clinical narrative stays with us until `POST /patient-assignments`.

  ### Why "prescreens"

  It names the **state the patient is now in**: pre-screened at the booth, and
  waiting for a nurse to confirm where they go. That is the whole lifecycle in
  two calls, and it is your vocabulary, not ours — your existing export is
  called *Prescreen*, and it already has `measure_spid` / `measure_name` /
  `measure_department` for who took the numbers and where.

  ```
  POST /patient-prescreens    ← screened, awaiting confirmation   (this request)
  POST /patient-assignments   ← nurse confirmed, patient queued
  ```

  Deliberately not "observations": in a clinical system that implies an
  assessment, and the point of this call is that nothing has been assessed yet.

  ### Identifying the patient — VN **and** HN

  `visit_id` is in the body, shaped like your `POST /patient-assignments`
  rather than as a path parameter, so both writes look the same to you.

  We send **both identifiers**: the VN the patient entered at the booth, and
  the HN we resolved from it. You do not need the HN — your contract says the
  third party must not send `patient_id` because you derive it from the visit —
  but sending it lets you **cross-check that the two agree** before writing
  anything. If they ever disagree, something has gone wrong upstream of you and
  it is far better caught here than after a patient is queued under the wrong
  record. Reject or ignore it if you prefer; it costs us nothing to omit.

  ### First and second location — your export's own model

  Your Prescreen export already tracks *where the patient was seen*:
  `measure_*`, `first_location_*`, `second_location_*`. Our two writes map
  straight onto it, which is why they are two calls and not one:

  | Call | Sets | Meaning |
  |---|---|---|
  | `POST /patient-prescreens` | `measure_*` + **`first_location`** | the patient was seen at the AI booth and measured there |
  | `POST /patient-assignments` | **`second_location`** | a nurse confirmed, and the patient is being sent on |

  So `first_location` is the booth, `second_location` is the destination
  department — exactly the before/after your export already describes. We are
  not asking you to add a concept; we are filling in the one you have.

  ### What it would carry

  | Field | Source |
  |---|---|
  | `visit_id` | the VN the patient entered at the booth — you verify it, and derive the patient from it |
  | `vitals` | cuff BP and pulse, plus temperature/weight/height when taken. `sources` marks **each field** as `device` or `patient_input` — the cuff and the patient's own answer are different evidence and should not be charted alike |
  | `measured_at` | when, so a later reading supersedes it |
  | `location` | that the patient passed through the AI pre-screening booth — your attendance/audit trail |
  | `session_ref`, `slip_code` | so staff can find the full record (same identity, see the assignment request) |

  Where it lands is yours to decide: onto the visit row, into an observations
  table, or somewhere provisional. If you would rather receive nothing before
  nurse sign-off, that is a legitimate answer — we would keep the measurements
  on our side and they would reach you in the SBAR at assignment time instead.
url: "{{imedBaseUrl}}/patient-prescreens"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "visit_id": "{{imedVisitId}}",
      "hn": "{{imedHn}}",
      "session_ref": "{{session_id}}",
      "slip_code": "MCH-A1B2-C3D4",
      "first_location": {
        "id": "AI-BOOTH-01",
        "name": "AI Pre-Screening Booth",
        "department": "แผนก ผู้ป่วยนอก(หน่วยคัดกรอง)"
      },
      "measured_at": "2026-08-07T09:12:00+07:00",
      "vitals": {
        "systolic": 158,
        "diastolic": 94,
        "pulse_bpm": 96,
        "temperature_c": 36.8,
        "weight_kg": 72.5,
        "height_cm": 165,
        "sources": {
          "systolic": "device",
          "diastolic": "device",
          "pulse_bpm": "device",
          "temperature_c": "patient_input",
          "weight_kg": "patient_input",
          "height_cm": "patient_input"
        }
      }
    }
order: 6000
