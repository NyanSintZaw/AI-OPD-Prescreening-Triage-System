id: 3b030caa-3d85-59d5-a249-4c1fc684d500
name: HIS Integration (hospital-facing)
description: |-
  What our system sends to the hospital's real **iMed Patient Assignment API** — the integration surface for the hospital IT team.

  **imed-assignment / from-contract** — the call as your contract defines it. This is what we will actually send. Start here.

  **imed-assignment / proposed** — fields and an endpoint we are *asking for*. Nothing here exists in your contract today.

  Your contract is transcribed verbatim in `docs/imed-patient-assignment-api.md` and left untouched; our analysis and the numbered change requests are in `docs/imed-integration-plan.md`.

  Auth is a single bearer token (`hisToken`). Every ⚠️ value is a placeholder awaiting your master data.

  *The calls our adapter makes against our own demo mock HIS live in a separate collection, `Mock HIS (demo only)` — they are our assumptions, not your API.*
auth:
  - id: 10641a24-2125-4429-b55f-1731d747c20f
    type: bearer
    name: bearer auth
    credentials:
      token: "{{hisToken}}"
