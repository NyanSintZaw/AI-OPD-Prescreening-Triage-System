$kind: http-request
name: gate:resume_choice
description: |-
  **Gate (resume_choice) — classify one yes/no-ish reply**

  Only when the deterministic regex classifier is unsure. The model returns one enum value and never generates anything the patient hears.

  Carries no patient identifier — see `docs/ai-model-io.md`.
url: "{{aiModelBaseUrl}}/chat/completions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "model": "{{aiModelName}}",
      "messages": [
        {
          "role": "user",
          "content": "A hospital kiosk found the patient's earlier assessment (status: in_progress) and asked whether they want to CONTINUE it or START OVER with a new one.\nClassify the patient's reply below (Thai or English). Answer with exactly one verdict:\n- continue: they want to pick up the earlier assessment\n- start_over: they want a fresh assessment from the beginning\n- unclear: cannot tell\nSession language: th.\nPatient reply: 'ไม่มีแล้วค่ะ ขอบคุณค่ะ'"
        }
      ],
      "temperature": 0.1,
      "stream": false,
      "response_format": {
        "type": "json_schema",
        "json_schema": {
          "name": "gate_resume_choice",
          "strict": true,
          "schema": {
            "properties": {
              "verdict": {
                "enum": [
                  "continue",
                  "start_over",
                  "unclear"
                ],
                "title": "Verdict",
                "type": "string"
              }
            },
            "required": [
              "verdict"
            ],
            "title": "_ResumeVerdict",
            "type": "object"
          }
        }
      }
    }
examples: ./.resources/gate-resume_choice.resources/examples
order: 6000
