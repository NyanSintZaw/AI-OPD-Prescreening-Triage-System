$kind: http-request
description: |-
  **Paraphrase — reword one approved question**

  When the rules engine has picked the next question and it is safe to reword. Red-flag and measurement questions are asked verbatim from the criteria and never go near the model.

  Carries no patient identifier — see `docs/ai-model-io.md`.
url: "{{aiModelBaseUrl}}/chat/completions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "model": "{{aiModelName}}",
      "messages": [
        {
          "role": "user",
          "content": "คุณเป็นผู้ช่วยคัดกรองของโรงพยาบาลที่พูดจาอบอุ่นและใจเย็น พูดภาษาไทยเท่านั้น ช่วยเรียบเรียงคำถามคัดกรองต่อไปนี้ให้เป็นธรรมชาติ โดยคงความหมายทางคลินิกเดิมทุกประการ ถามเพียงหนึ่งคำถาม ความยาวหนึ่งถึงสองประโยคสั้น ๆ ห้ามใช้ศัพท์แพทย์ และห้ามพูดถึงระดับการคัดกรองหรือการวินิจฉัย\nห้ามถามซ้ำสิ่งที่ผู้ป่วยตอบไปแล้ว\nพร้อมกันนี้ให้เสนอตัวเลือกคำตอบสั้น ๆ 3 หรือ 4 ตัวเลือก (ไม่เกิน 30 ตัวอักษรต่อตัวเลือก) เป็นภาษาไทย แตกต่างกันชัดเจน ครอบคลุมคำตอบที่เป็นไปได้ ห้ามมีการวินิจฉัย ระดับการคัดกรอง หรือชื่อยา\nบริบทผู้ป่วย: แน่นหน้าอกมา 2 ชั่วโมง\nข้อมูลที่ผู้ป่วยตอบแล้ว ห้ามถามซ้ำ: อายุ 58 ปี | ความดัน 158/94\nคำถามที่ต้องเรียบเรียง: อาการเจ็บหน้าอกร้าวไปที่แขน คอ หรือกรามหรือไม่"
        }
      ],
      "temperature": 0.1,
      "stream": false,
      "response_format": {
        "type": "json_schema",
        "json_schema": {
          "name": "question",
          "strict": true,
          "schema": {
            "description": "Structured paraphrase: the reworded question + tappable answers.",
            "properties": {
              "question": {
                "description": "The rephrased screening question",
                "title": "Question",
                "type": "string"
              },
              "options": {
                "description": "3 or 4 short, mutually distinct answer choices the patient could tap, in the same language as the question",
                "items": {
                  "type": "string"
                },
                "title": "Options",
                "type": "array"
              }
            },
            "required": [
              "question"
            ],
            "title": "PhrasedQuestion",
            "type": "object"
          }
        }
      }
    }
examples: ./.resources/question.resources/examples
order: 2000
