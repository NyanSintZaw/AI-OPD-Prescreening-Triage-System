$kind: http-example
request:
  url: "{{aiModelBaseUrl}}/chat/completions"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "model": "{{aiModelName}}",
        "messages": [
          {
            "role": "user",
            "content": "A hospital kiosk showed the patient the name on their record and asked 'is this you?'\nClassify the patient's reply below (Thai or English). Answer with exactly one verdict:\n- yes: the reply confirms it is them\n- no: the reply says it is not them / wrong name / wrong person\n- unclear: cannot tell (off-topic, ambiguous)\nSession language: th.\nPatient reply: 'ไม่มีแล้วค่ะ ขอบคุณค่ะ'"
          }
        ],
        "temperature": 0.1,
        "stream": false,
        "response_format": {
          "type": "json_schema",
          "json_schema": {
            "name": "gate_identity_yesno",
            "strict": true,
            "schema": {
              "properties": {
                "verdict": {
                  "enum": [
                    "yes",
                    "no",
                    "unclear"
                  ],
                  "title": "Verdict",
                  "type": "string"
                }
              },
              "required": [
                "verdict"
              ],
              "title": "_IdentityVerdict",
              "type": "object"
            }
          }
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "chatcmpl-mfu-0001",
        "object": "chat.completion",
        "model": "{{aiModelName}}",
        "choices": [
          {
            "index": 0,
            "message": {
              "role": "assistant",
              "content": "{\"verdict\": \"yes\"}"
            },
            "finish_reason": "stop"
          }
        ],
        "usage": {
          "prompt_tokens": 0,
          "completion_tokens": 0,
          "total_tokens": 0
        }
      }
order: 1000
