$kind: http-example
request:
  url: "{{aiModelBaseUrl}}/chat/completions"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "model": "{{aiModelName}}",
        "messages": [
          {
            "role": "user",
            "content": "A hospital kiosk found the patient's earlier assessment (status: in_progress) and asked whether they want to CONTINUE it or START OVER with a new one.\nClassify the patient's reply below (Thai or English). Answer with exactly one verdict:\n- continue: they want to pick up the earlier assessment\n- start_over: they want a fresh assessment from the beginning\n- unclear: cannot tell\nSession language: th.\nPatient reply: 'ไม่มีแล้วค่ะ ขอบคุณค่ะ'"
          }
        ],
        "temperature": 0.1,
        "stream": false,
        "response_format": {
          "type": "json_schema",
          "json_schema": {
            "name": "gate_resume_choice",
            "strict": true,
            "schema": {
              "properties": {
                "verdict": {
                  "enum": [
                    "continue",
                    "start_over",
                    "unclear"
                  ],
                  "title": "Verdict",
                  "type": "string"
                }
              },
              "required": [
                "verdict"
              ],
              "title": "_ResumeVerdict",
              "type": "object"
            }
          }
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "chatcmpl-mfu-0001",
        "object": "chat.completion",
        "model": "{{aiModelName}}",
        "choices": [
          {
            "index": 0,
            "message": {
              "role": "assistant",
              "content": "{\"verdict\": \"continue\"}"
            },
            "finish_reason": "stop"
          }
        ],
        "usage": {
          "prompt_tokens": 0,
          "completion_tokens": 0,
          "total_tokens": 0
        }
      }
order: 1000
