$kind: http-request
name: gate:followup_decline
description: |-
  **Gate (followup_decline) — classify one yes/no-ish reply**

  Only when the deterministic regex classifier is unsure. The model returns one enum value and never generates anything the patient hears.

  Carries no patient identifier — see `docs/ai-model-io.md`.
url: "{{aiModelBaseUrl}}/chat/completions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "model": "{{aiModelName}}",
      "messages": [
        {
          "role": "user",
          "content": "A hospital kiosk assistant just asked the patient (in Thai or English): 'Is there anything else you would like to ask, or anything to note for the doctor?'\nClassify the patient's reply below. Answer with exactly one verdict:\n- decline: the reply only declines or politely closes the conversation (e.g. 'No, nothing else', 'I'm done, thanks', 'no worries, I'm all set', 'ไม่มีแล้วค่ะ ขอบคุณค่ะ')\n- content: the reply contains an actual question, symptom, or note the doctor should see\n- unclear: cannot tell\nSession language: th. Context: -\nPatient reply: 'ไม่มีแล้วค่ะ ขอบคุณค่ะ'"
        }
      ],
      "temperature": 0.1,
      "stream": false,
      "response_format": {
        "type": "json_schema",
        "json_schema": {
          "name": "gate_followup_decline",
          "strict": true,
          "schema": {
            "properties": {
              "verdict": {
                "enum": [
                  "decline",
                  "content",
                  "unclear"
                ],
                "title": "Verdict",
                "type": "string"
              }
            },
            "required": [
              "verdict"
            ],
            "title": "_FollowupVerdict",
            "type": "object"
          }
        }
      }
    }
examples: ./.resources/gate-followup_decline.resources/examples
order: 4000
